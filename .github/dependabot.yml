# Mises à jour automatiques (module 09).
# ⚠️ Dependabot ne lit ce fichier que sur la branche par défaut : sur la branche
# `solution`, il sert de modèle à recopier sur ta propre branche principale.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
